name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if:
      github.event_name == 'push' || (github.event_name ==
      'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies and build frontend
        run: |
          npm install
          npm run build --workspace=react-frontend
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token:
            ${{
            secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MEADOW_0583E4810
            }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          # We build with Node 20 in the step above and upload the
          # prebuilt dist directly (skip_app_build uploads app_location).
          app_location: "packages/react-frontend/dist" # prebuilt output
          api_location: "" # Api source code path - optional
          output_location: "" # app_location already points at the build
          skip_app_build: true # built in the step above with Node 20
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if:
      github.event_name == 'pull_request' && github.event.action
      == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token:
            ${{
            secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MEADOW_0583E4810
            }}
          action: "close"
