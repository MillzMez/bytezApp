name: CI Testing

on:
  push:
    branches:
      - main
      - 15-complete-te6-continuous-integrationdeployment

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm ci
      - run: npm run lint
      - run: npm test
